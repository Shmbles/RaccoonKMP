[versions]
# --- CORE (Alineado a Estabilidad OpenAnimationApp) ---
agp = "8.2.2"
kotlin = "2.0.0"
composeMultiplatform = "1.6.10"
composeHotReload = "1.0.0-rc02"

# --- ANDROID (Estable) ---
android-compileSdk = "34" # Ajustado a AGP 8.2.2
android-minSdk = "24"
android-targetSdk = "34" # Ajustado a AGP 8.2.2

# --- LIBS ---
androidx-activity = "1.9.0" # Versión estable compatible
androidx-lifecycle = "2.8.0" # Versión estable compatible

# --- ACTUALIZACIONES OBLIGATORIAS PARA KOTLIN 2.0 ---
decompose = "3.0.0" # Versión compatible con Kotlin 2.0.0
essenty = "2.0.0" # Versión compatible con Kotlin 2.0.0
ktor = "2.3.11" # Versión estable compatible
kotlinx-coroutines = "1.8.0" # Versión estable compatible
kotlinx-serialization = "1.6.3" # Versión estable compatible

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

# --- DECOMPOSE (Ajustado a v3) ---
decompose-core = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-compose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }
essenty-lifecycle = { module = "com.arkivanov.essenty:lifecycle", version.ref = "essenty" }
essenty-lifecycle-coroutines = { module = "com.arkivanov.essenty:lifecycle-coroutines", version.ref = "essenty" }
essenty-state-keeper = { module = "com.arkivanov.essenty:state-keeper", version.ref = "essenty" }


# --- KTOR ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx = { module = "io.ktor:ktor-serialization-kotlinx", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-client-http-android = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-http-desktop = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-http-ios = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
